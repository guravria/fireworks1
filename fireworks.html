<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fireworks Generator</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #000;
            overflow: hidden;
            font-family: 'Inter', sans-serif;
        }
        canvas {
            display: block;
        }
        .info {
            position: absolute;
            top: 20px;
            left: 20px;
            color: rgba(255, 255, 255, 0.7);
            font-size: 16px;
            text-shadow: 0 0 2px #000;
            pointer-events: none;
        }
        .info span {
            font-weight: bold;
            color: white;
        }
    </style>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
    <canvas id="fireworksCanvas"></canvas>
    <div class="info">Click or Tap to launch fireworks!</div>

    <script>
        const canvas = document.getElementById('fireworksCanvas');
        const ctx = canvas.getContext('2d');
        let fireworks = [];
        let particles = [];
        let hue = 120; // Start with green

        // Set canvas to full screen
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        // --- Event Listeners ---
        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });

        // Click or tap to launch a firework
        function launchFirework(e) {
            let x, y;
            if (e.type === 'click') {
                x = e.clientX;
                y = e.clientY;
            } else if (e.type === 'touchstart') {
                x = e.touches[0].clientX;
                y = e.touches[0].clientY;
            }
            createFirework(canvas.width / 2, canvas.height, x, y);
        }

        canvas.addEventListener('click', launchFirework);
        canvas.addEventListener('touchstart', launchFirework);

        // --- Helper Functions ---
        function random(min, max) {
            return Math.random() * (max - min) + min;
        }

        // --- Classes ---

        // The rocket that flies up
        class Firework {
            constructor(startX, startY, endX, endY) {
                this.x = startX;
                this.y = startY;
                this.startX = startX;
                this.startY = startY;
                this.endX = endX;
                this.endY = endY;
                this.distanceToEnd = Math.sqrt(Math.pow(endX - startX, 2) + Math.pow(endY - startY, 2));
                this.distanceTraveled = 0;

                this.angle = Math.atan2(endY - startY, endX - startX);
                this.speed = 2;
                this.acceleration = 1.05;
                this.brightness = random(50, 70);
                this.targetRadius = 1;
                this.trail = [];
                this.trailLength = 3;
            }

            update() {
                this.trail.push({ x: this.x, y: this.y });
                if (this.trail.length > this.trailLength) {
                    this.trail.shift();
                }
                
                this.speed *= this.acceleration;
                
                const vx = Math.cos(this.angle) * this.speed;
                const vy = Math.sin(this.angle) * this.speed;
                
                this.distanceTraveled = Math.sqrt(Math.pow(this.x - this.startX, 2) + Math.pow(this.y - this.startY, 2));

                if (this.distanceTraveled >= this.distanceToEnd) {
                    // Explode
                    createParticles(this.endX, this.endY);
                    return true; // Mark for removal
                } else {
                    this.x += vx;
                    this.y += vy;
                }
                return false;
            }

            draw() {
                ctx.beginPath();
                const lastTrailPoint = this.trail[this.trail.length - 1] || { x: this.x, y: this.y };
                ctx.moveTo(lastTrailPoint.x, lastTrailPoint.y);
                ctx.lineTo(this.x, this.y);
                ctx.lineWidth = 2;
                ctx.strokeStyle = `hsl(${hue}, 100%, ${this.brightness}%)`;
                ctx.stroke();
            }
        }

        // The explosion particles
        class Particle {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.angle = random(0, Math.PI * 2);
                this.speed = random(1, 10);
                this.friction = 0.95; // slows down the particle
                this.gravity = 1;
                this.hue = random(hue - 20, hue + 20);
                this.brightness = random(50, 80);
                this.alpha = 1;
                this.decay = random(0.015, 0.03); // how fast it fades
                this.trail = [];
                this.trailLength = 5;
            }

            update() {
                this.trail.push({ x: this.x, y: this.y });
                if (this.trail.length > this.trailLength) {
                    this.trail.shift();
                }

                this.speed *= this.friction;
                this.x += Math.cos(this.angle) * this.speed;
                this.y += Math.sin(this.angle) * this.speed + this.gravity;
                this.alpha -= this.decay;

                return this.alpha <= this.decay; // Mark for removal
            }

            draw() {
                ctx.beginPath();
                const lastTrailPoint = this.trail[this.trail.length - 1] || { x: this.x, y: this.y };
                ctx.moveTo(lastTrailPoint.x, lastTrailPoint.y);
                ctx.lineTo(this.x, this.y);
                ctx.lineWidth = 2;
                ctx.strokeStyle = `hsla(${this.hue}, 100%, ${this.brightness}%, ${this.alpha})`;
                ctx.stroke();
            }
        }
        
        // --- Creation Functions ---
        function createFirework(startX, startY, endX, endY) {
             fireworks.push(new Firework(startX, startY, endX, endY));
        }
        
        function createParticles(x, y) {
            const particleCount = 100;
            for (let i = 0; i < particleCount; i++) {
                particles.push(new Particle(x, y));
            }
        }

        // --- Main Animation Loop ---
        function animate() {
            requestAnimationFrame(animate);
            
            // Cycle through colors
            hue += 0.5;
            
            // Create a trailing effect by filling the canvas with a semi-transparent black
            ctx.fillStyle = 'rgba(0, 0, 0, 0.05)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // Randomly launch fireworks from the bottom
            if (random(0, 100) < 5) {
                createFirework(
                    canvas.width / 2,
                    canvas.height,
                    random(0, canvas.width),
                    random(0, canvas.height / 2)
                );
            }
            
            // Update and draw fireworks
            for (let i = fireworks.length - 1; i >= 0; i--) {
                fireworks[i].draw();
                if (fireworks[i].update()) {
                    fireworks.splice(i, 1);
                }
            }
            
            // Update and draw particles
            for (let i = particles.length - 1; i >= 0; i--) {
                particles[i].draw();
                if (particles[i].update()) {
                    particles.splice(i, 1);
                }
            }
        }

        // Start the show!
        animate();
    </script>
</body>
</html>
